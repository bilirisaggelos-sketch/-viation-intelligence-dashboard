name: Update Intelligence

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes. (This was previously missing entirely, so the
    # feed only ever updated when someone manually clicked "Run workflow".)
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Collector
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          python scripts/fetch_intel.py

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # -f (force) is required here: data/live-intel.json is in
          # .gitignore (so a plain local "git add ." never accidentally
          # commits your machine's copy), but THIS workflow is meant to
          # be the one place that legitimately commits it, so GitHub
          # Pages has something to serve. Without -f, "git add" on a
          # gitignored path silently does nothing - no error, no commit,
          # no push - which is exactly why the live site can end up
          # stuck showing stale/empty data with no visible failure
          # anywhere in the Action logs.
          git add -f data/live-intel.json

          git diff --staged --quiet || git commit -m "Update live intelligence"

          git push
